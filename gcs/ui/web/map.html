<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>Mapa</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      .leaflet-control-attribution {
        font-size: 11px;
      }
      .drone-icon {
        width: 24px;
        height: 24px;
        transform-origin: 50% 50%;
      }
      .drone-icon .arrow {
        width: 0;
        height: 0;
        margin: 0 auto;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 16px solid #e63946;
        transform-origin: 50% 60%;
      }
      .drone-icon svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 6px rgba(82, 255, 139, 0.9));
      }
      .drone-icon .drone-glow {
        filter: drop-shadow(0 0 8px rgba(82, 255, 139, 0.9))
          drop-shadow(0 0 14px rgba(82, 255, 139, 0.65));
      }
      .drone-icon .drone-rot {
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      const map = L.map("map").setView([40.4168, -3.7038], 5);
      const baseOSM = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }
      );
      const baseSat = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          attribution: "Tiles &copy; Esri",
        }
      );
      baseOSM.addTo(map);
      L.control
        .layers(
          {
            Mapa: baseOSM,
            Satelital: baseSat,
          },
          {},
          { position: "topright" }
        )
        .addTo(map);

      let marker = null;
      let droneMarker = null;
      const droneSvg =
        '<div class="drone-rot">' +
        '<svg class="drone-glow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640">' +
        '<g fill="#52ff8b" stroke="#0a0f0a" stroke-width="14" stroke-linejoin="round">' +
        '<path d="M176,312.88135l-47.91833,39.20483a40.06346,40.06346,0,0,1,15.12054,23.95361L176,348.28906Z"/>' +
        '<circle cx="104" cy="104" r="24"/>' +
        '<path d="M141.8158,117.01074a40.08828,40.08828,0,0,1-10.41474,16.0896l38.956,21.251a7.9597,7.9597,0,0,1,2.0653-1.50659l18.30591-9.15284Z"/>' +
        '<polygon points="200 156.944 184 164.944 184 195.056 200 203.056 200 156.944"/>' +
        '<path d="M339.57764,152.84473a7.96071,7.96071,0,0,1,2.0653,1.50659l38.95594-21.251a40.08942,40.08942,0,0,1-10.41468-16.0896l-48.91247,26.68115Z"/>' +
        '<circle cx="416" cy="384" r="24"/>' +
        '<circle cx="408" cy="104" r="24"/>' +
        '<path d="M390.71118,353.03516,336,312v36.03711l40.35327,30.73022A39.98522,39.98522,0,0,1,390.71118,353.03516Z"/>' +
        '<circle cx="104" cy="384" r="24"/>' +
        '<path d="M296,232V136H216v96a8.00076,8.00076,0,0,1-2.34326,5.65723L192,259.31348V384h16V312a8.00008,8.00008,0,0,1,8-8h80a8.00008,8.00008,0,0,1,8,8v72h16V288H208V272H320V259.31348l-21.65674-21.65625A8.00076,8.00076,0,0,1,296,232Z"/>' +
        '<path d="M224,384h64V320H224Zm32-56a24,24,0,1,1-24,24A24.02718,24.02718,0,0,1,256,328Z"/>' +
        '<polygon points="312 203.056 328 195.056 328 164.944 312 156.944 312 203.056"/>' +
        '<circle cx="256" cy="352" r="8"/>' +
        '<path d="M472,104A64.00885,64.00885,0,0,0,346.65137,85.71777l15.335,4.56446a47.97254,47.97254,0,1,1,39.14746,61.23144l-2.26758,15.83789A64.04327,64.04327,0,0,0,472,104Z"/>' +
        '<path d="M359.53369,50.75391a71.97108,71.97108,0,1,1,26.86279,121.95117l-4.793,15.26562A88.01248,88.01248,0,1,0,320.43408,95.21L336.356,96.79A71.79544,71.79544,0,0,1,359.53369,50.75391Z"/>' +
        '<path d="M150.01367,90.28223l15.335-4.56446a63.9757,63.9757,0,1,0-52.21484,81.63379l-2.26758-15.83789A48.71618,48.71618,0,0,1,104,152a48,48,0,1,1,46.01367-61.71777Z"/>' +
        '<path d="M104,192a88.004,88.004,0,0,0,26.39648-4.0293l-4.793-15.26562A72.013,72.013,0,1,1,175.644,96.79L191.56592,95.21A88.00286,88.00286,0,1,0,104,192Z"/>' +
        '<path d="M40,384a64.00407,64.00407,0,0,0,116.52393,36.57715l-13.12305-9.1543A48.00192,48.00192,0,1,1,104,336V320A64.07239,64.07239,0,0,0,40,384Z"/>' +
        '<path d="M104,456a72,72,0,1,1,14.4082-142.55957l3.1836-15.67969a88.00583,88.00583,0,1,0,63.08252,121.44238l-14.66211-6.40624A72.03483,72.03483,0,0,1,104,456Z"/>' +
        '<path d="M416,448a64,64,0,0,0,0-128v16a48,48,0,1,1-39.40088,75.42285l-13.12305,9.1543A64.08948,64.08948,0,0,0,416,448Z"/>' +
        '<path d="M416,296a88.608,88.608,0,0,0-17.5918,1.76074l3.1836,15.67969a72.00609,72.00609,0,1,1-51.604,99.35645l-14.66211,6.40624A88.00884,88.00884,0,1,0,416,296Z"/>' +
        "</g></svg></div>";

      function setDronePosition(lat, lng, headingDeg = 0) {
        const latLng = L.latLng(lat, lng);
        if (droneMarker) {
          droneMarker.setLatLng(latLng);
        } else {
          const icon = L.divIcon({
            className: "drone-icon",
            html: droneSvg,
            iconSize: [44, 44],
            iconAnchor: [22, 22],
          });
          droneMarker = L.marker(latLng, { icon }).addTo(map);
        }
        const el = droneMarker.getElement();
        if (el) {
          const rot = el.querySelector(".drone-rot");
          if (rot) {
            rot.style.transform = `rotate(${headingDeg}deg)`;
          }
        }
      }

      function setMapView(lat, lng, zoom = 17) {
        map.setView([lat, lng], zoom, { animate: true });
      }

      new QWebChannel(qt.webChannelTransport, (channel) => {
        const bridge = channel.objects.bridge;
        map.on("click", (e) => {
          const { lat, lng } = e.latlng;
          if (marker) {
            marker.setLatLng(e.latlng);
          } else {
            marker = L.marker(e.latlng).addTo(map);
          }
          bridge.sendCoordinates(lat, lng);
        });
      });

      window.setDronePosition = setDronePosition;
      window.setMapView = setMapView;
    </script>
  </body>
</html>
